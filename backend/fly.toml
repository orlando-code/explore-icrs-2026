# fly.toml app configuration file generated for icrs-offset-api on 2026-07-25T19:29:45+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'icrs-offset-api'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

# TURNSTILE_SECRET, ADMIN_TOKEN and CLIENT_HINT_SALT are secrets:
#   fly secrets set ADMIN_TOKEN="$(openssl rand -hex 32)"
[env]
  ALLOWED_ORIGINS = 'https://orlando-codes.com,https://www.orlando-codes.com,https://orlando-code.github.io'
  OFFSET_DB_PATH = '/data/offsets.db'
  OFFSET_BACKUP_DIR = '/data/backups'
  OFFSET_BACKUP_KEEP = '500'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  REQUIRE_ORIGIN = '1'
  REQUIRE_DELEGATE_ID = '1'
  REVIEW_THRESHOLD_PER_HOUR = '60'

[[mounts]]
  source = 'offset_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
