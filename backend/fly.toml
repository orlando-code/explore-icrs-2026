# fly.toml app configuration file generated for icrs-offset-api on 2026-07-25T19:29:45+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'icrs-offset-api'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://orlando-codes.com,https://www.orlando-codes.com,https://orlando-code.github.io,http://localhost:8000,http://127.0.0.1:8000'
  OFFSET_DB_PATH = '/data/offsets.db'

[[mounts]]
  source = 'offset_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
